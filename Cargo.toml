[package]
name = "socle"
version = "0.1.0"
edition = "2024"
description = "Socle commun des applis egui de Desarrh : thème, icônes, composants, recherche floue, palette Ctrl+K, images, utilitaires"
license = "MIT"
publish = false

# Chaque app n'embarque que ce qu'elle active. Rien n'est actif par défaut sauf le thème.
[features]
default = ["theme"]
# --- interface (egui) ---
theme = ["dep:egui"]
icons = ["dep:egui"]
keys = ["dep:egui"]                                  # raccourcis compatibles AZERTY (Ctrl+chiffre)
ui = ["theme", "icons", "keys", "fuzzy"]                    # composants + palette Ctrl+K + champ d'autocomplétion
# --- logique pure (sans egui) ---
fuzzy = ["dep:memchr"]                               # recherche floue + autocomplétion (historique)
# --- images ---
images = ["dep:image", "dep:qoi", "dep:memchr"]                    # PNG, JPEG, GIF, WebP, BMP, ICO, TIFF, TGA, DDS (BC1-3), HDR, QOI, PSD, aperçu RAW + miniatures + cache
img-exr = ["images", "image/exr"]                    # OpenEXR (crate exr, ~0,5 Mo)
img-svg = ["images", "dep:resvg"]                    # SVG (resvg, ~1,5 Mo)
img-jxl = ["images", "dep:jxl-oxide"]                # JPEG XL en Rust pur (~1 Mo)
img-wic = ["images", "dep:windows"]                  # Windows (WIC) : HEIC, AVIF, JXR, DDS BC7, RAW complet, JPEG réduit au décodage
# --- utilitaires ---
settings = ["dep:serde", "dep:serde_json"]           # %APPDATA%\<App>\settings.json, écriture atomique
crash = []                                           # crash.log + signalement au lancement suivant
instance = ["dep:windows-sys"]                       # instance unique (mutex + tube nommé)
update = ["dep:serde_json", "dep:zip"]               # mise à jour GitHub Releases (curl.exe)
# tout, pour la démo et les tests
full = ["ui", "images", "img-exr", "img-svg", "img-jxl", "img-wic", "settings", "crash", "instance", "update"]

[dependencies]
egui = { version = "0.37.0", optional = true }    # sans default_fonts : les polices viennent de Windows (comme les apps)
memchr = { version = "2.8.3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
image = { version = "0.25.10", optional = true, default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "tga", "dds", "hdr", "qoi"] }
qoi = { version = "0.4.1", optional = true }
resvg = { version = "0.50", optional = true, default-features = false, features = ["svgz"] }
jxl-oxide = { version = "0.12.6", optional = true, default-features = false, features = ["image"] }
zip = { version = "9", optional = true, default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_IO"] }
windows = { version = "0.62", optional = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_Graphics_Imaging"] }

[dev-dependencies]
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard", "links"] }
winit = "0.30.13"
softbuffer = "0.4.8"
hdrshot-egui-backend = "0.2.0"
bytemuck = "1"

[[example]]
name = "demo"
required-features = ["ui", "images"]

[[example]]
name = "taille"

[[bench]]
name = "perf"
harness = false
required-features = ["fuzzy", "images"]

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
